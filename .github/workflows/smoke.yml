name: smoke

# Fast feedback on every push / PR:
#  1. `checks`  — static + unit signal with no browser/Docker (typecheck, lint,
#                 Vitest unit tests, dependency audit). Fails fast, runs in ~1 min.
#  2. `smoke`   — spin up Juice Shop in Docker and run the @smoke suite on chromium.
# Full cross-browser regression runs nightly (nightly-regression.yml).
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks (static + unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test:unit

      # Supply-chain signal (OWASP A06): fail the build on a known high/critical
      # vulnerability in a dependency. Dependabot (see .github/dependabot.yml)
      # opens the fix PRs.
      - name: Dependency audit
        run: npm audit --audit-level=high

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the Playwright browser binaries between runs (keyed on the pinned
      # @playwright/test version in the lockfile).
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (chromium + OS deps)
        run: npx playwright install --with-deps chromium

      - name: Start Juice Shop
        run: docker compose up -d

      - name: Wait for Juice Shop to be ready
        run: npm run app:wait

      - name: Run @smoke suite (chromium, excluding quarantined @flaky)
        run: npx playwright test --grep @smoke --grep-invert @flaky --project=chromium

      - name: Tear down Juice Shop
        if: always()
        run: docker compose down

      # On failure, publish the HTML report + traces/screenshots/videos so a
      # failing run is debuggable straight from the Actions UI.
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
