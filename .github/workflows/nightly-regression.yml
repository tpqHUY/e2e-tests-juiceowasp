name: nightly-regression

# Full @regression suite across all three browser engines every night, sharded
# across parallel runners for speed. Each shard emits its own allure-results; a
# `report` job merges them into one Allure trend report deployed to GitHub Pages
# (Settings → Pages → Source: "GitHub Actions"). Smoke (chromium) runs per-push in
# smoke.yml; this is the deep, cross-browser safety net.
on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC ≈ 01:00 Vietnam time
  workflow_dispatch:

# Permissions required by the official GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two Pages deployments run at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Run the suite in 3 parallel shards ────────────────────────────────────────
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright (all engines + OS deps)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Juice Shop
        run: docker compose up -d

      - name: Wait for Juice Shop to be ready
        run: npm run app:wait

      # Fresh container ⇒ full product stock, so cross-browser ordering tests
      # never hit Juice Shop's finite stock (see docs/exploratory-notes.md).
      - name: Run @regression (shard ${{ matrix.shard }}/3, all browsers, excl. quarantined @flaky)
        run: npx playwright test --grep @regression --grep-invert @flaky --shard=${{ matrix.shard }}/3

      - name: Tear down Juice Shop
        if: always()
        run: docker compose down

      # Always upload this shard's raw Allure results (even on failure) so the
      # merged report includes failing tests. Filenames are UUIDs ⇒ no collision.
      - name: Upload shard allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          retention-days: 3

  # ── Merge shards into one Allure report (with trend history) ──────────────────
  report:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java (Allure report generation needs a JRE)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Collect every shard's results into a single allure-results/ directory.
      - name: Download all shard results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: shard-results

      - name: Merge shard results
        run: |
          mkdir -p allure-results
          cp -r shard-results/*/. allure-results/ || true

      # Carry Allure trend history across runs (unique key each run, restore the
      # most recent) so the report shows pass/fail trends over time.
      - name: Restore Allure history
        uses: actions/cache@v6
        with:
          path: allure-history-store
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Generate Allure report (preserving trend history)
        run: |
          if [ -d allure-history-store ]; then
            cp -r allure-history-store allure-results/history
          fi
          node scripts/prepare-allure.mjs
          npx allure generate allure-results --clean -o allure-report
          rm -rf allure-history-store
          cp -r allure-report/history allure-history-store

      - name: Upload report as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

      - name: Upload merged report as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-report
          path: allure-report/
          retention-days: 14

  # ── Deploy the Allure report to GitHub Pages ──────────────────────────────────
  deploy:
    needs: report
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ── Make the overall run red if any shard failed (report is already deployed) ──
  status:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any regression shard failed
        if: needs.regression.result == 'failure'
        run: |
          echo "Regression suite had failures — see the published Allure report."
          exit 1

  # ── Quarantined @flaky tests: run them, but NEVER gate the pipeline ───────────
  # Keeps flaky tests exercised (so we can watch their stability + decide when to
  # un-quarantine) without letting them turn the nightly red. No-op until a test
  # is tagged @flaky.
  flaky-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright (all engines + OS deps)
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start Juice Shop
        run: docker compose up -d
      - name: Wait for Juice Shop to be ready
        run: npm run app:wait
      # Extra retries to measure how flaky they still are. Exits 0 even on failure.
      - name: Run quarantined @flaky tests (non-gating)
        run: npx playwright test --grep @flaky --retries=3 || true
      - name: Tear down Juice Shop
        if: always()
        run: docker compose down
      - name: Upload flaky report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-report
          path: playwright-report/
          retention-days: 7
